name: Gradle Release

on:
  push:
    branches:
      - 1.21
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: chmod +x ./gradlew && ./gradlew build --stacktrace

      - name: Publish jar to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          JARS=$(ls build/libs/*.jar | grep -v -- '-sources\|-dev\|-javadoc' || true)
          gh release create "$TAG" $JARS \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --generate-notes --prerelease
